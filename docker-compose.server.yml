name: wolfbot

# deathwolf — WolfBot Discord bot. Adopted from a manual `docker run` orphan
# into a managed stack on its own bridge network (off the default bridge).
# The image (wolfbot:latest) is prebuilt; its config is baked into the image.
# Source code: https://github.com/therudywolf/WolfBot (this dir is deploy-only).
services:
  wolfbot:
    image: wolfbot
    container_name: deathwolf
    command: ["python", "wolfbot.py"]
    environment:
      # База — в томе wolfbot_data (/app/data), а не в слое контейнера.
      # Тот же путь ставит Dockerfile; здесь он записан явно для деплоя.
      DATABASE_PATH: /app/data/bot_database.db
    restart: unless-stopped
    networks:
      - default
    cpu_shares: 256
    mem_limit: 128m
    mem_reservation: 32m
    # hardening 2026-11
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    # no read_only/tmpfs on purpose: ops/backup.sh does `docker exec ... sqlite3 backup to /tmp/bot_database.db` + `docker cp deathwolf:/tmp/...`,
    # and docker cp cannot read files from a tmpfs mount
    pids_limit: 128
    oom_score_adj: 300
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    driver: bridge
